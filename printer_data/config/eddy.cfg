# The MCU section only applies to the Eddy USB. For Eddy Coil you will use the MCU name of the toolboard that you connected the Eddy Coil to.
[mcu eddy]
#serial: /dev/serial/by-id/usb-Klipper_rp2040_eddy-if00 # This is the serial address of your eddy probe. This can be found by using the terminal of your klipper instance (typically through SSH) and using the command ```ls /dev/serial/by-id``` 
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404083DB01C-if00 #26-08-06
restart_method: command
#Did you read all of the comments before the macros? Make sure that you do and then uncomment the ones that you need. Remove this line when you are done.

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[probe_eddy_current btt_eddy]
sensor_type: ldc1612
#z_offset: 2.5 # 26-08-09 26-08-10 leonardo had 0
descend_z: 2.5 # this replaced Z_offset in Klipper update 26-08-09 ???????????????????????????????????????????????????????????????????????????? leonardo had 0.5
#i2c_address:
i2c_mcu: eddy  # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the MCU you have used.
i2c_bus: i2c0f # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the I2C bus you have used.
# Measure the offsets below using the method described here: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-x-and-y-offsets
# For a standard Voron stealthburner X carriage mount there should be no need to change the defaults below.
x_offset: -16 # was 0 26-08-06
y_offset: 11.5 # was 21.42 26-08-06
samples_result: median #26-08-09
samples_tolerance: .005 #26-08-09
samples_tolerance_retries: 3 #26-08-09

# This section is only relevant for Eddy USB. Comment it out for Eddy Coil.
[temperature_probe btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 3 # was 2 26-08-07 ????

[bed_mesh]
speed: 150 #500 ????
horizontal_move_z: 3 # was 3 26-08-06 tried 5 too high in mesh 26-08-08
mesh_min: 15,18 # These min/max points are with the above linked Eddy mount on the stock toolhead.
mesh_max: 335,335
probe_count: 15,15 # 25,25 # Set to a lower 15,15 default as it appears a too high probe_count (too dense mesh) is bad with rapid_scan, see: https://www.klipper3d.org/Bed_Mesh.html#rapid-continuous-scanning ????
algorithm: bicubic
bicubic_tension: 0.5
split_delta_z: 0.0125 # see: https://www.klipper3d.org/Bed_Mesh.html#move-splitting
mesh_pps: 3,3
adaptive_margin: 5
fade_start: 1
fade_end: 10
fade_target: 0
# TRY NEXT LINE WHEN WORKING WELL 26-08-10 ????
#scan_overshoot: 5  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

# COMMENTED FOR REFERENCE, WE NOW USE HOMING OVERRIDE BELOW
# Uncomment this if you are using Eddy as the probe AND the homing endstop
#[safe_z_home]
#home_xy_position: 175, 175 # 26-08-06
#z_hop: 10
#z_hop_speed: 25
#speed: 200

# THIS HOMING OVERRIDE ALWAYS GOES BACK TO CENTER FIRST BEFORE HOMING THE OTHER AXIS
# THIS ALREADY INCLUDES THE EDDY HOMING OVERRIDES/CHANGES
[homing_override]
gcode:
  # Move 5 up, just in case (this is our safety zhop, this needs 'set_position_z: 0' below)
  #Set_position_z: 0 # 26-08-11
  G91 ; set relative positioning
  G0 Z5 F1000 ; 5 up zhop
  #Set_position_z: 0 # 26-08-10 # turned off 26-08-10 back
  {% if not rawparams or 'Y' in rawparams %}
    {action_respond_info('Homing Y')}
    G28 Y
    G90 ; set absolute positioning
    G0 Y175.0 F6000 ; return to center # was 177.5 26-08-10
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'X' in rawparams %}
    {action_respond_info('Homing X')}
    G28 X
    G90 ; set absolute positioning
    G0 X175.0 F6000 ; return to center # was 177.5 26-08-10
    M400 ; Wait for move to finish
  {% endif %}
  {% if not rawparams or 'Z' in rawparams %}
    {action_respond_info('Homing Z')}
    G90 ; set absolute positioning
    G0 X175.0 Y175.0 F6000 ; return to center, please add your offsets manually if you want to # was 177.5 177.5 26-08-10
    G28 Z
    G0 Z10 F1000 ; move to z10 before probe
    PROBE # Eddy needs a manual PROBE before calling the 'SET_Z_FROM_PROBE'
    SET_Z_FROM_PROBE
    G0 Z5 F1000 ; move to z5 to finish
    M400 ; Wait for move to finish
  {% endif %}
  G90 ; set absolute positioning
axes: xyz
set_position_z: 0 # This forces the z position to be at 0 when we start homing, so we can move the Z up before homing.


