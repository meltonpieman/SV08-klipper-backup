# ALTERATIONS copied EDDY.CFG on 26-08-12 except macros SAME AS LEONARDO'S 26-08-12A
# The MCU section only applies to the Eddy USB. For Eddy Coil you will use the MCU name of the toolboard that you connected the Eddy Coil to.

[mcu eddy] #26-08-12A
serial: /dev/serial/by-id/usb-Klipper_rp2040_50443404083DB01C-if00 #26-08-06
restart_method: command


[temperature_sensor btt_eddy_mcu] #26-08-12A
sensor_type: temperature_mcu # Sets the type of sensor for Klipper to read
sensor_mcu: eddy # Sets the MCU of the eddy probe tempereature sensor
min_temp: 10 # Sets the minimum tempereature for eddys tempereature sensor to operate
max_temp: 100 # Sets the maximum tempereature for eddys tempereature sensor to operate

[probe_eddy_current btt_eddy] #26-08-12A but hed did not have 3xsamples lines
sensor_type: ldc1612
#z_offset: 2.5 #was 2.5 # 26-08-09 26-08-10 leonardo had 0 #26-08-12
descend_z: 0.5 #2.5 # this replaced Z_offset in Klipper update 26-08-09 #26-08-12A
i2c_mcu: eddy  # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the MCU you have used.
i2c_bus: i2c0f # This value is good for the Eddy USB but would need to be adjusted for the Eddy Coil according to the I2C bus you have used.
# Measure the offsets below using the method described here: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-x-and-y-offsets
x_offset: -16 #26-08-06
y_offset: 11.5 #26-08-06
samples_result: median #26-08-09
samples_tolerance: .005 #26-08-09
samples_tolerance_retries: 3 #26-08-09

[temperature_probe btt_eddy] #26-08-12A except horizontal_move_z was in safe_home and was 1
sensor_type: Generic 3950
sensor_pin: eddy:gpio26
horizontal_move_z: 3 # was 2 26-08-07

[SAFE_HOME_Z] #26-08-12 LEONARDO ADDED THIS IN PRINTER CFG ???
home_xy_position: 175, 175 # Bed center
z_hop: 10
z_hop_speed: 25
speed: 200

[force_move]
enable_force_move: True # Required for initial manual Z calibration

[bed_mesh]
zero_reference_position: 175, 175
speed: 200
horizontal_move_z: 3 # was 3 26-08-06 tried 5 too high in mesh 26-08-08 LEONARDO HAD 1 ????
mesh_min: 15,18 # These min/max points are with the above linked Eddy mount on the stock toolhead.
mesh_max: 335,335
probe_count: 15,15 # 25,25 # TRY 20X20 ???? Set to a lower 15,15 default as it appears a too high probe_count (too dense mesh) is bad with rapid_scan, see: https://www.klipper3d.org/Bed_Mesh.html#rapid-continuous-scanning ????
algorithm: bicubic
bicubic_tension: 0.5 #LEONARDO HAD 0.4 ????
split_delta_z: 0.0125 # 26-08-12 LEONARDO HAD 0.016 ???? see: https://www.klipper3d.org/Bed_Mesh.html#move-splitting
mesh_pps: 3,3
adaptive_margin: 5
fade_start: 1 #26-08-12 LEONARDO HAD 0
fade_end: 10
fade_target: 0 #26-08-12 LEONARDO DID NOT HAVE THIS
# TRY NEXT LINE WHEN WORKING WELL 26-08-12 ????
#scan_overshoot: 5  #uncomment this section if you still have room left over on the X axis for some scan overshoot to product smoother movements and more accurate scanning. Uncommenting this should be fine if you are using a standard voron mount.

